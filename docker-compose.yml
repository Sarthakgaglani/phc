services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projecth
      POSTGRES_USER: projecth
      POSTGRES_PASSWORD: projecth
    ports:
      - "5433:5432"
    volumes:
      - projecth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  projecth_postgres_data:
