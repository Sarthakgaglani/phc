name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projecth
          POSTGRES_USER: projecth
          POSTGRES_PASSWORD: projecth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projecth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: projecth.settings
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: projecth
      POSTGRES_USER: projecth
      POSTGRES_PASSWORD: projecth
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 .

      - name: Run migrations (smoke test)
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest
